<!DOCTYPE html><html><head><meta charset="utf-8"/><title>{{ title }}</title>
<link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Synthetic demo reports — draft assist always includes a disclaimer.</p>
<form method="post" action="/ui/reports"><input name="title" placeholder="Report title" required/><button>Create</button></form>
    {% if draft %}<pre>{{ draft }}</pre>{% endif %}
    <ul>{% for r in reports %}<li>{{ r.title }} — {{ r.status }}
    <form method="post" action="/ui/draft/{{ r.id }}"><button>Draft assist</button></form></li>{% endfor %}</ul>
</main></body></html>
