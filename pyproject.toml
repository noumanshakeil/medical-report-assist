[project]
name = "medical-report-assist"
version = "2.0.0"
description = "Synthetic medical-report workspace with findings, editable sections, and draft assist that always attaches a mandatory non-clinical disclaimer."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
